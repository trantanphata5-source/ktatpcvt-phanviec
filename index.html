<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Quản lý Công việc Phòng KTAT | PC Vũng Tàu</title>
  <meta name="description" content="Hệ thống quản lý và phân công công việc Phòng Kỹ thuật và An toàn - Công ty Điện lực Vũng Tàu (EVNHCMC)">

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page login-page-light">

  <div class="login-container">
    <div class="login-card">
      <!-- Brand -->
      <div class="login-brand">
        <img src="logo.png" alt="EVNHCMC" class="login-brand-logo-img">
        <div class="login-brand-subtitle">Công ty Điện lực Vũng Tàu</div>
        <h1 class="login-brand-title">
          Quản lý Công việc<br>
          <span>Phòng Kỹ thuật & An toàn</span>
        </h1>
      </div>


      <!-- Login Form -->
      <form id="loginForm" autocomplete="off">
        <div id="loginError" class="login-error">
          ⚠️ Tên đăng nhập hoặc mật khẩu không đúng!
        </div>

        <div class="login-form-group">
          <label class="login-label" for="loginUsername">Chọn nhân viên</label>
          <div class="login-input-wrap">
            <select id="loginUsername" class="login-input login-select" required>
              <option value="" disabled selected>-- Chọn tên của bạn --</option>
            </select>
            <span class="login-input-icon">👤</span>
          </div>
        </div>

        <div class="login-form-group">
          <label class="login-label" for="loginPassword">Mật khẩu</label>
          <div class="login-input-wrap">
            <input type="password" id="loginPassword" class="login-input" placeholder="Mật khẩu (mặc định: 123)" required>
            <span class="login-input-icon">🔒</span>
          </div>
          <div style="font-size: 12px; color: #64748b; margin-top: 6px; display: flex; align-items: center; gap: 5px; white-space: nowrap;">
            <span>💡</span><span>Mật khẩu mặc định: <strong style="color: #003399; font-weight: 700;">123</strong></span>
          </div>
        </div>

        <label class="login-remember">
          <input type="checkbox" id="loginRemember" checked>
          <span>Ghi nhớ đăng nhập</span>
        </label>

        <button type="submit" class="login-btn" id="loginBtn">
          🔐 Đăng nhập hệ thống
        </button>
      </form>

      <!-- Footer -->
      <div class="login-footer">
        <p class="login-footer-text">
          Phòng Kỹ thuật và An toàn — PC Vũng Tàu<br>
          Hệ thống quản lý nội bộ © 2026
        </p>
      </div>
    </div>
  </div>

  <script src="app_data.js"></script>
  <script>
    (function() {
      'use strict';

      const SESSION_KEY = 'KTAT_USER_SESSION';

      // Check existing session
      const saved = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
      if (saved) {
        try {
          const session = JSON.parse(saved);
          if (session && session.empId) {
            window.location.href = 'dashboard.html';
            return;
          }
        } catch(e) {}
      }

      // Background pull latest passwords from Google Sheet
      const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbwBk3G9iV75PzxgWYEz5mZyFVqbWFwqUjdTSYOOtEN8x4SazmeR7EJCZmxPdmSETs-Y4w/exec';
      try {
        fetch(`${CLOUD_URL}?_t=${Date.now()}`)
          .then(r => r.json())
          .then(res => {
            if (res && res.customPasswords && typeof res.customPasswords === 'object') {
              const localPw = JSON.parse(localStorage.getItem('KTAT_CUSTOM_PASSWORDS') || '{}');
              const merged = Object.assign({}, localPw, res.customPasswords);
              localStorage.setItem('KTAT_CUSTOM_PASSWORDS', JSON.stringify(merged));
            }
          }).catch(() => {});
      } catch(e) {}

      // Populate employee dropdown grouped by team
      const selectEl = document.getElementById('loginUsername');
      const accounts = window.KTAT_AUTH_DATA ? window.KTAT_AUTH_DATA.accounts : [];
      const employees = window.INITIAL_APP_DATA ? window.INITIAL_APP_DATA.employees : [];

      const teams = [
        { id: 'BLĐ', label: '🏢 Ban Lãnh đạo Phòng' },
        { id: 'TKT', label: '⚡ Tổ Kỹ thuật' },
        { id: 'TCNTT', label: '💻 Tổ Công nghệ thông tin' }
      ];

      teams.forEach(team => {
        const teamEmps = employees.filter(e => e.team === team.id);
        if (teamEmps.length === 0) return;
        const optgroup = document.createElement('optgroup');
        optgroup.label = team.label;
        teamEmps.forEach(emp => {
          const account = accounts.find(a => a.empId === emp.id);
          if (!account) return;
          const tag = emp.is_reinforced ? ' (Tăng cường Đội VHLĐ)' : '';
          opt.textContent = `${emp.name} — ${emp.position}${tag}`;
          optgroup.appendChild(opt);
        });
        selectEl.appendChild(optgroup);
      });

      const form = document.getElementById('loginForm');
      const errorBox = document.getElementById('loginError');
      const passwordInput = document.getElementById('loginPassword');
      const rememberCheck = document.getElementById('loginRemember');

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        errorBox.style.display = 'none';

        const username = selectEl.value;
        const password = passwordInput.value.trim();

        if (!username) {
          errorBox.textContent = '⚠️ Vui lòng chọn tên của bạn!';
          errorBox.style.display = 'block';
          return;
        }

        if (!password) {
          errorBox.textContent = '⚠️ Vui lòng nhập mật khẩu!';
          errorBox.style.display = 'block';
          passwordInput.focus();
          return;
        }

        // Check custom passwords first (from password changes)
        let customPasswords = {};
        try { customPasswords = JSON.parse(localStorage.getItem('KTAT_CUSTOM_PASSWORDS') || '{}'); } catch(e) {}

        // Find account by username
        const accountByName = accounts.find(a => a.username === username);
        if (!accountByName) {
          errorBox.textContent = '⚠️ Tài khoản không tồn tại!';
          errorBox.style.display = 'block';
          return;
        }

        // Check password: custom first, then default
        const validPassword = customPasswords[accountByName.empId] || accountByName.password;
        if (password !== validPassword) {
          errorBox.textContent = '⚠️ Mật khẩu không đúng!';
          errorBox.style.display = 'block';
          passwordInput.focus();
          return;
        }

        const account = accountByName;

        // Save session
        const session = {
          empId: account.empId,
          role: account.role,
          username: account.username,
          loginAt: new Date().toISOString()
        };

        sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
        if (rememberCheck.checked) {
          localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        }

        // Navigate to dashboard
        window.location.href = 'dashboard.html';
      });
    })();
  </script>
</body>
</html>
